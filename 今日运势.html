<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日运势</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --surface: rgba(255,255,255,0.08);
  --border: rgba(212,179,255,0.25);
  --text: #f5ecff;
  --muted: rgba(245,236,255,0.6);
  --accent: #d4b3ff;
  --accent-pink: #ffa8dd;
  --accent-cyan: #9aeaff;
  --accent-gold: #ffd89a;
}

html, body {
  height: 100%;
  font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse 90% 60% at 50% 0%,   rgba(180,120,255,0.28) 0%, transparent 55%),
    radial-gradient(ellipse 70% 55% at 15% 100%, rgba(255,140,210,0.18) 0%, transparent 55%),
    radial-gradient(ellipse 70% 55% at 85% 100%, rgba(130,180,255,0.18) 0%, transparent 55%),
    linear-gradient(180deg, #2a1552 0%, #1c0a3a 45%, #140628 100%);
  background-attachment: fixed;
  overflow-x: hidden;
}

#starsCanvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}

#app { position: relative; z-index: 1; min-height: 100vh; }

/* ---- Screens ---- */
.screen {
  display: none; min-height: 100vh;
  flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 20px; text-align: center;
}
.screen.active { display: flex; }

/* ---- Typography ---- */
.step-label {
  font-size: 0.72rem; letter-spacing: 0.3em; color: var(--muted);
  margin-bottom: 18px;
}
h2 { font-size: clamp(1.35rem, 4vw, 1.85rem); letter-spacing: 0.05em; margin-bottom: 6px; }
.sub-label { font-size: 0.84rem; color: var(--muted); margin-bottom: 8px; }

/* ---- Buttons ---- */
.btn {
  display: inline-block; padding: 13px 38px;
  border: 1.5px solid var(--accent); border-radius: 40px;
  background: rgba(212,179,255,0.08); color: var(--accent);
  font-size: 0.95rem; letter-spacing: 0.14em;
  cursor: pointer; transition: all 0.28s; font-family: inherit;
  margin-top: 8px;
  backdrop-filter: blur(4px);
}
.btn:hover {
  background: var(--accent); color: #1a0a35;
  box-shadow: 0 0 28px rgba(212,179,255,0.55);
  transform: translateY(-1px);
}
.btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }
.btn-ghost { border-color: rgba(255,255,255,0.22); color: rgba(255,255,255,0.45); background: transparent; }
.btn-ghost:hover { background: rgba(255,255,255,0.08); color: var(--text); box-shadow: none; }

/* ---- Back button ---- */
#backBtn {
  position: fixed; top: 18px; left: 18px; z-index: 20;
  font-size: 0.8rem; color: var(--muted); background: none; border: none;
  cursor: pointer; font-family: inherit; letter-spacing: 0.1em;
  display: none; transition: color 0.2s;
}
#backBtn:hover { color: var(--text); }

/* ================================================================
   WELCOME SCREEN – Zodiac Wheel Logo
================================================================ */
.logo-wheel {
  width: 240px; height: 240px;
  position: relative;
  margin: 0 auto 24px;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
}

/* Soft radial glow behind wheel */
.logo-wheel::before {
  content: '';
  position: absolute;
  inset: 20px;
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(212,179,255,0.18) 0%, transparent 60%),
    radial-gradient(circle at 50% 40%, rgba(255,200,150,0.1) 0%, transparent 50%);
  pointer-events: none;
  animation: pulse-glow 4s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.05); }
}

/* Thin orbit ring */
.logo-wheel::after {
  content: '';
  position: absolute;
  inset: 28px;
  border-radius: 50%;
  border: 1px dashed rgba(212,179,255,0.25);
  pointer-events: none;
}

.logo-ring { position: absolute; inset: 0; }

.zs {
  position: absolute;
  top: 50%; left: 50%;
  width: 34px; height: 34px;
  margin: -17px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  color: var(--accent);
  text-shadow:
    0 0 10px rgba(212,179,255,0.8),
    0 0 20px rgba(212,179,255,0.4);
  transform:
    rotate(calc(var(--i) * 30deg))
    translate(0, -102px)
    rotate(calc(var(--i) * -30deg));
  animation: zs-twinkle 3.6s ease-in-out infinite;
  animation-delay: calc(var(--i) * 0.2s);
}
@keyframes zs-twinkle {
  0%, 100% { opacity: 0.55; }
  50%      { opacity: 1; }
}

/* Center cute jiaobei pair */
.logo-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 116px; height: 116px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 0 16px rgba(255,200,150,0.4));
  animation: center-bob 5s ease-in-out infinite;
}
@keyframes center-bob {
  0%, 100% { transform: translate(-50%, -50%) translateY(0); }
  50%      { transform: translate(-50%, -50%) translateY(-4px); }
}
.logo-center svg { width: 100%; height: 100%; overflow: visible; }

.welcome-title {
  font-size: clamp(2.1rem, 6vw, 2.9rem);
  letter-spacing: 0.22em; margin-bottom: 8px;
  background: linear-gradient(135deg, #fff2c4 0%, #ffc7f0 50%, #b8e6ff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.welcome-en {
  font-size: 0.74rem; letter-spacing: 0.4em;
  color: var(--muted); margin-bottom: 42px;
}
.welcome-note {
  font-size: 0.74rem; color: var(--muted);
  margin-top: 36px; letter-spacing: 0.14em;
}

/* ================================================================
   SELECTION GRIDS
================================================================ */
.sel-grid {
  display: grid; gap: 8px;
  width: 100%; max-width: 440px; margin: 20px 0 28px;
}
.zodiac-grid { grid-template-columns: repeat(4, 1fr); }
.mbti-grid   { grid-template-columns: repeat(4, 1fr); }

.sel-item {
  padding: 11px 4px; border: 1px solid var(--border);
  border-radius: 12px; background: var(--surface);
  cursor: pointer; transition: all 0.22s;
  font-size: 0.85rem; color: var(--text);
  font-family: inherit; letter-spacing: 0.04em;
  backdrop-filter: blur(3px);
}
.sel-item:hover {
  border-color: var(--accent);
  background: rgba(212,179,255,0.12);
}
.sel-item.selected {
  border-color: var(--accent);
  background: rgba(212,179,255,0.22);
  color: var(--accent);
  box-shadow: 0 0 14px rgba(212,179,255,0.35);
}

/* ================================================================
   JIAOBEI SCREEN – Press and Hold
================================================================ */
.jiaobei-area {
  position: relative;
  width: 260px;
  height: 200px;
  margin: 22px auto 10px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: grab;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 30px;
  padding-bottom: 30px;
}
.jiaobei-area:active { cursor: grabbing; }

/* Energy glow aura */
.jglow {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 55%, rgba(255,225,170,0.4) 0%, transparent 55%),
    radial-gradient(circle at 50% 55%, rgba(212,179,255,0.3) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
  filter: blur(18px);
}

/* Cupped hands (visible when pressing) */
.jhands {
  position: absolute;
  bottom: 8px;
  left: 50%;
  width: 220px;
  height: 70px;
  transform: translateX(-50%) translateY(30px) scale(0.95);
  opacity: 0;
  transition: all 0.4s cubic-bezier(.2,.8,.3,1);
  pointer-events: none;
}
.jhands svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }

/* Blocks */
.jblock {
  width: 64px;
  height: 96px;
  position: relative;
  z-index: 2;
  transition: transform 0.4s cubic-bezier(.25,.8,.3,1);
  pointer-events: none;
}
.jblock svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* --- Holding state --- */
.jiaobei-area.holding .jglow { opacity: 1; }
.jiaobei-area.holding .jhands {
  opacity: 1;
  transform: translateX(-50%) translateY(0) scale(1);
}
.jiaobei-area.holding #jb1 {
  animation: hold-a 1.9s ease-in-out infinite;
}
.jiaobei-area.holding #jb2 {
  animation: hold-b 1.9s ease-in-out infinite 0.25s;
}
@keyframes hold-a {
  0%, 100% { transform: translateY(-22px) rotate(-6deg); }
  50%      { transform: translateY(-30px) rotate(-3deg); }
}
@keyframes hold-b {
  0%, 100% { transform: translateY(-22px) rotate(6deg); }
  50%      { transform: translateY(-30px) rotate(3deg); }
}

/* Floating sparkles during hold */
.jspark {
  position: absolute;
  top: 50%; left: 50%;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff3c4 0%, rgba(255,200,150,0.5) 50%, transparent 100%);
  opacity: 0;
  pointer-events: none;
}
.jiaobei-area.holding .jspark {
  animation: spark-rise 2.2s ease-out infinite;
}
.jspark:nth-child(1) { animation-delay: 0s;   --dx: -50px; }
.jspark:nth-child(2) { animation-delay: 0.4s; --dx:  30px; }
.jspark:nth-child(3) { animation-delay: 0.8s; --dx: -20px; }
.jspark:nth-child(4) { animation-delay: 1.2s; --dx:  50px; }
.jspark:nth-child(5) { animation-delay: 1.6s; --dx: -35px; }
@keyframes spark-rise {
  0%   { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
  15%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), -120px) scale(1.3); }
}

/* --- Throwing state (dynamic end rotation via CSS vars) --- */
/* Block final rotation set via --end-a / --end-b in JS */
@keyframes throw-a {
  0%   { transform: translateY(-22px) rotate(-4deg); opacity: 1; }
  15%  { transform: translateY(-120px) rotate(-280deg); opacity: 1; }
  40%  { transform: translateY(-140px) rotate(-560deg); opacity: 1; }
  70%  { transform: translateY(-60px) rotate(-840deg); opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(0) rotate(var(--end-a, -960deg)); opacity: 1; }
}
@keyframes throw-b {
  0%   { transform: translateY(-22px) rotate(4deg); opacity: 1; }
  18%  { transform: translateY(-130px) rotate(320deg); opacity: 1; }
  42%  { transform: translateY(-150px) rotate(640deg); opacity: 1; }
  72%  { transform: translateY(-50px) rotate(900deg); opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(0) rotate(var(--end-b, 1000deg)); opacity: 1; }
}
.jiaobei-area.throwing #jb1 {
  animation: throw-a 1.6s cubic-bezier(.25,.1,.3,1) forwards;
}
.jiaobei-area.throwing #jb2 {
  animation: throw-b 1.6s cubic-bezier(.25,.1,.3,1) forwards;
}

/* --- Settled state (after throwing animation) --- */
.jiaobei-area.settled #jb1 {
  transform: translateY(0) rotate(var(--end-a, 0deg));
  transition: none;
}
.jiaobei-area.settled #jb2 {
  transform: translateY(0) rotate(var(--end-b, 0deg));
  transition: none;
}

/* Flat side indicator (lighter = 阳/flat, darker inner = 阴/curved) */
/* We use scaleY(-1) to flip a block to show "curved up" (阴面) */

/* --- Jiaobei explanation section --- */
.jb-explain {
  width: 100%; max-width: 360px;
  margin: 16px auto 4px;
  display: flex; gap: 10px; justify-content: center;
}
.jb-ex-item {
  flex: 1;
  padding: 12px 6px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.06);
  text-align: center;
}
.jb-ex-name {
  font-size: 0.88rem;
  font-weight: 600;
  margin-bottom: 8px;
  letter-spacing: 0.08em;
}
.jb-ex-name.ex-sheng { color: #8ce6b0; }
.jb-ex-name.ex-xiao  { color: var(--accent-gold); }
.jb-ex-name.ex-yin   { color: #ffa0a0; }

.jb-ex-icons {
  display: flex; justify-content: center; gap: 6px;
  margin-bottom: 6px; height: 38px; align-items: center;
}
.jb-ex-icons .mini-block {
  width: 16px; height: 28px;
  border-radius: 6px;
  border: 1.5px solid #8a5a28;
  position: relative;
}
.mini-block.flat {
  background: linear-gradient(180deg, #ffe3ae, #c8884a);
}
.mini-block.curved {
  background: linear-gradient(180deg, #8a5520, #5a3010);
}
.jb-ex-desc {
  font-size: 0.68rem;
  color: var(--muted);
  line-height: 1.5;
  letter-spacing: 0.04em;
}

/* Hint text */
.jb-hint {
  font-size: 0.88rem;
  color: var(--accent);
  letter-spacing: 0.14em;
  margin: 6px 0 20px;
  opacity: 0.85;
  transition: all 0.3s;
  min-height: 1.4rem;
}
.jb-hint.pressing {
  color: var(--accent-gold);
  animation: hint-pulse 1.4s ease-in-out infinite;
}
@keyframes hint-pulse {
  0%, 100% { opacity: 0.7; letter-spacing: 0.14em; }
  50%      { opacity: 1;   letter-spacing: 0.18em; }
}

/* Result reveal */
.jb-result-row {
  min-height: 2.6rem;
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  margin: 4px 0 12px;
}
.jb-name {
  font-size: 1.55rem;
  letter-spacing: 0.22em;
  background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-pink) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  opacity: 0;
  transition: opacity 0.6s;
}
.jb-sub {
  font-size: 0.8rem; color: var(--muted); letter-spacing: 0.18em;
  opacity: 0; transition: opacity 0.6s 0.15s;
}
.jb-name.show, .jb-sub.show { opacity: 1; }

/* ================================================================
   RESULT SCREEN
================================================================ */
.result-wrap { width: 100%; max-width: 400px; }

.info-chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
.chip {
  padding: 5px 14px; border: 1px solid var(--border);
  border-radius: 20px; font-size: 0.76rem; color: var(--muted);
  letter-spacing: 0.1em; backdrop-filter: blur(3px);
}

.result-card {
  border-radius: 24px; padding: 42px 30px 34px;
  position: relative; overflow: hidden;
  animation: fadeUp 0.7s ease both;
  backdrop-filter: blur(6px);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.tier-name { font-size: clamp(2.2rem, 8vw, 3.3rem); font-weight: 700; letter-spacing: 0.22em; margin-bottom: 6px; }
.tier-en   { font-size: 0.72rem; letter-spacing: 0.38em; color: var(--muted); margin-bottom: 28px; }
.divider   { width: 50px; height: 1.5px; margin: 0 auto 24px; border-radius: 2px; }
.desc-text { font-size: 0.94rem; line-height: 2; text-align: left; color: #f5ecff; }

/* 宜 / 忌 */
.yi-ji {
  margin: 20px 0 16px;
  padding: 16px 18px;
  border-radius: 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.07);
  text-align: left;
}
.yj-row { display: flex; align-items: flex-start; gap: 10px; font-size: 0.88rem; line-height: 1.9; }
.yj-row + .yj-row { margin-top: 10px; }
.yj-tag {
  flex-shrink: 0;
  padding: 2px 10px;
  border-radius: 6px;
  font-size: 0.76rem;
  letter-spacing: 0.1em;
  font-weight: 600;
  margin-top: 3px;
}
.yj-yi .yj-tag { background: rgba(100,210,150,0.18); color: #8ce6b0; }
.yj-ji .yj-tag { background: rgba(255,120,120,0.16); color: #ffa0a0; }
.yj-text { color: var(--text); }

/* MBTI 专属梗 */
.mbti-box {
  margin: 16px 0;
  padding: 14px 18px;
  border-radius: 12px;
  border-left: 3px solid var(--accent);
  background: rgba(212,179,255,0.06);
  font-size: 0.88rem;
  line-height: 1.9;
  text-align: left;
}
.mbti-label {
  font-size: 0.72rem;
  color: var(--accent);
  letter-spacing: 0.14em;
  margin-bottom: 6px;
}

/* 金句 */
.fortune-quote {
  margin: 18px 0 0;
  font-size: 0.95rem;
  font-style: italic;
  color: var(--accent-gold);
  text-align: center;
  letter-spacing: 0.06em;
  line-height: 1.8;
  opacity: 0.9;
}

/* 分享按钮 */
.share-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 22px auto 0;
  padding: 12px 32px;
  border: 1.5px solid var(--border);
  border-radius: 30px;
  background: var(--surface);
  color: var(--accent);
  font-size: 0.88rem;
  letter-spacing: 0.12em;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s;
  backdrop-filter: blur(4px);
}
.share-btn:hover {
  border-color: var(--accent);
  background: rgba(212,179,255,0.15);
  box-shadow: 0 0 18px rgba(212,179,255,0.3);
}
.share-btn.copied {
  border-color: rgba(140,230,160,0.6);
  color: #8ce6b0;
}

.result-note { margin-top: 24px; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-align: center; }

/* Tier: Bronze */
.t-bronze .result-card {
  border: 1.5px solid rgba(210,140,70,0.45);
  background: linear-gradient(150deg, rgba(210,140,70,0.12), rgba(140,80,40,0.04));
  box-shadow: 0 0 40px rgba(210,140,70,0.15);
}
.t-bronze .tier-name { color: #e2963d; text-shadow: 0 0 20px rgba(210,140,70,0.4); }
.t-bronze .divider { background: #e2963d; }

/* Tier: Silver */
.t-silver .result-card {
  border: 1.5px solid rgba(210,210,230,0.45);
  background: linear-gradient(150deg, rgba(210,210,230,0.12), rgba(140,140,170,0.04));
  box-shadow: 0 0 40px rgba(210,210,230,0.15);
}
.t-silver .tier-name { color: #e0e0ee; text-shadow: 0 0 20px rgba(210,210,230,0.5); }
.t-silver .divider { background: #e0e0ee; }

/* Tier: Gold */
.t-gold .result-card {
  border: 1.5px solid rgba(255,220,80,0.5);
  background: linear-gradient(150deg, rgba(255,220,80,0.13), rgba(200,150,30,0.04));
  box-shadow: 0 0 55px rgba(255,220,80,0.18);
}
.t-gold .tier-name { color: #ffdd66; text-shadow: 0 0 24px rgba(255,220,80,0.55); }
.t-gold .divider { background: #ffdd66; }

/* Tier: Diamond */
.t-diamond .result-card {
  border: 1.5px solid rgba(80,210,255,0.5);
  background: linear-gradient(150deg, rgba(80,210,255,0.12), rgba(170,80,255,0.08));
  box-shadow: 0 0 60px rgba(100,200,255,0.22);
}
.t-diamond .tier-name {
  background: linear-gradient(90deg, #4fd4ff, #c070ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.t-diamond .divider { background: linear-gradient(90deg, #4fd4ff, #c070ff); }

/* Tier: Hidden */
.t-hidden .result-card {
  border: 1.5px solid rgba(255,255,255,0.25);
  background: linear-gradient(150deg, rgba(255,120,240,0.1), rgba(120,120,255,0.1));
  box-shadow: 0 0 80px rgba(230,180,255,0.25);
}
.t-hidden .tier-name {
  background: linear-gradient(90deg, #ff7beb, #ffe07a, #7be5ff, #cc9bff, #ff7beb);
  background-size: 300%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: holo 4s linear infinite;
}
@keyframes holo {
  0%   { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}
.t-hidden .divider { background: linear-gradient(90deg, #ff7beb, #7be5ff); height: 2px; }

/* Hidden sparkles */
.sparkle-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.sp {
  position: absolute; font-size: 0.7rem; color: rgba(255,255,255,0.65);
  animation: twinkle 2.2s ease-in-out infinite;
}
.sp:nth-child(2) { animation-delay: 0.6s; }
.sp:nth-child(3) { animation-delay: 1.2s; }
.sp:nth-child(4) { animation-delay: 1.8s; }
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50%      { opacity: 1; transform: scale(1.15); }
}

/* Admin removed */

/* Mobile tweaks */
@media (max-width: 360px) {
  .zodiac-grid { grid-template-columns: repeat(3, 1fr); }
  .sel-item { font-size: 0.75rem; padding: 8px 2px; }
  .logo-wheel { width: 210px; height: 210px; }
  .zs { transform: rotate(calc(var(--i) * 30deg)) translate(0, -88px) rotate(calc(var(--i) * -30deg)); }
}
</style>
</head>

/* ============================================================

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Seeded pseudo-random generator (deterministic by seed)
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Get the Monday of the current week (week boundary)
function getWeekMonday() {
  const d = new Date();
  const day = d.getDay(); // 0=Sun, 1=Mon...
  const diff = d.getDate() - day + (day === 0 ? -6 : 1); // adjust to Monday
  const mon = new Date(d.setDate(diff));
  return `${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`;
}

// Auto-generate weekly zodiac scores
// Each zodiac gets 7 daily scores per week: one 90s, one 80s, two 70s, three 60s
// The distribution is shuffled by zodiac+week seed, then day-of-week picks from it
function getZodiacScores() {
  const monday = getWeekMonday();
  const d = new Date();
  const dow = d.getDay(); // 0=Sun..6=Sat
  const dayIndex = dow === 0 ? 6 : dow - 1; // Mon=0..Sun=6

  const scores = {};
  ZODIACS.forEach((z, zi) => {
    // Create seed from week + zodiac index
    const seedStr = monday + '_' + zi;
    let seedNum = 0;
    for (let i = 0; i < seedStr.length; i++) seedNum = ((seedNum << 5) - seedNum) + seedStr.charCodeAt(i);
    const rng = mulberry32(Math.abs(seedNum));

    // Base tiers for the week: [90, 80, 70, 70, 60, 60, 60]
    const bases = [90, 80, 70, 70, 60, 60, 60];

    // Fisher-Yates shuffle with seeded rng
    for (let i = bases.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [bases[i], bases[j]] = [bases[j], bases[i]];
    }

    // Add random single digit (0-9) to the base for today
    const randomDigit = Math.floor(rng() * 1000 + dayIndex * 137) % 10;
    scores[z] = bases[dayIndex] + randomDigit;
  });

  return scores;
}

function getTier(score) {
  if (score >= 95) return 'hidden';
  if (score >= 80) return 'diamond';
  if (score >= 70) return 'gold';
  if (score >= 60) return 'silver';
  return 'bronze';
}

// Date-based deterministic seed (same day = same picks)
function dateSeed() {
  const s = today().replace(/-/g, '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i);
  return Math.abs(h);
}

function pick(arr) { return arr[dateSeed() % arr.length]; }

  // Description
  let desc;
  if (tier === 'diamond') desc = score < 90 ? TIER_DESC.diamond_low : TIER_DESC.diamond_high;
  else if (tier === 'hidden') desc = TIER_DESC.hidden;
  else desc = TIER_DESC[tier];

  // 宜/忌
  const yjKey = tier === 'hidden' ? 'hidden' : tier === 'diamond' ? 'diamond' : tier;
  const yjSet = pick(YI_JI[yjKey] || YI_JI.gold);

  // 金句
  let qKey;
  if (tier === 'hidden') qKey = 'hidden';
  else if (tier === 'diamond') qKey = 'high';
  else if (tier === 'gold') qKey = 'mid';
  else qKey = 'low';
  const quote = pick(QUOTES[qKey]);

  // MBTI hint (always shown)
  const mbtiHint = MBTI_HINT[mbti] || '';

  return { desc, yi: yjSet.yi, ji: yjSet.ji, quote, mbtiHint };
}

/* ============================================================
   SCREEN MANAGEMENT
============================================================ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  curScreen = id;
  const back = document.getElementById('backBtn');
  back.style.display = ['s-zodiac','s-mbti','s-jiaobei'].includes(id) ? 'block' : 'none';
}

function goBack() {
  if (curScreen === 's-zodiac')   showScreen('s-welcome');
  if (curScreen === 's-mbti')     showScreen('s-zodiac');
  if (curScreen === 's-jiaobei')  showScreen('s-mbti');
}

/* ============================================================
   FLOW
============================================================ */
function startFlow() {
  // Already threw today?
  const saved = localStorage.getItem(`result_${today()}`);
  if (saved) {
    const d = JSON.parse(saved);
    selZodiac = d.zodiac; selMBTI = d.mbti;
    renderResult(d.tier, d.score, d.jiaobei);
    return;
  }
  // Restore previous selections
  selZodiac = localStorage.getItem('pref_zodiac') || null;
  selMBTI   = localStorage.getItem('pref_mbti')   || null;
  refreshZodiacGrid();
  refreshMBTIGrid();
  showScreen('s-zodiac');
}

function goToMBTI() {
  if (!selZodiac) return;
  localStorage.setItem('pref_zodiac', selZodiac);
  showScreen('s-mbti');
}

function goToJiaobei() {
  if (!selMBTI) return;
  localStorage.setItem('pref_mbti', selMBTI);
  thrown = false;
  pressing = false;
  const hint = document.getElementById('jbHint');
  hint.textContent = '长按珓杯祈愿 · 松手揭晓结果';
  hint.classList.remove('pressing');
  hint.style.opacity = '0.85';
  const name = document.getElementById('jbName');
  const sub  = document.getElementById('jbSub');
  name.textContent = '—';
  name.classList.remove('show');
  sub.textContent = '';
  sub.classList.remove('show');
  document.getElementById('jiaobeiArea').classList.remove('holding', 'throwing', 'settled');
  const exEl = document.getElementById('jbExplain');
  if (exEl) { exEl.style.opacity = '1'; exEl.style.transition = 'none'; }
  showScreen('s-jiaobei');
}

/* ============================================================
   GRIDS
============================================================ */
function buildGrid(containerId, items, getSelected, onSelect, nextBtnId) {
  const g = document.getElementById(containerId);
  g.innerHTML = '';
  items.forEach(item => {
    const b = document.createElement('button');
    b.className = 'sel-item' + (getSelected() === item ? ' selected' : '');
    b.dataset.val = item;
    b.textContent = item;
    b.onclick = () => {
      onSelect(item);
      g.querySelectorAll('.sel-item').forEach(el =>
        el.classList.toggle('selected', el.dataset.val === item));
      document.getElementById(nextBtnId).disabled = false;
    };
    g.appendChild(b);
  });
}

function refreshZodiacGrid() {
  buildGrid('zodiacGrid', ZODIACS, () => selZodiac, v => selZodiac = v, 'zodiacNext');
  document.getElementById('zodiacNext').disabled = !selZodiac;
}

function refreshMBTIGrid() {
  buildGrid('mbtiGrid', MBTIS, () => selMBTI, v => selMBTI = v, 'mbtiNext');
  document.getElementById('mbtiNext').disabled = !selMBTI;
}

/* ============================================================
   JIAOBEI PRESS-AND-HOLD
============================================================ */
const jArea = document.getElementById('jiaobeiArea');
const jHintEl = document.getElementById('jbHint');

function startPress(e) {
  if (thrown) return;
  if (pressing) return;
  if (e.cancelable) e.preventDefault();
  pressing = true;
  pressStart = Date.now();

  jArea.classList.add('holding');
  jHintEl.classList.add('pressing');
  jHintEl.textContent = '虔诚祈愿中... 松手掷杯';
}

function endPress(e) {
  if (!pressing) return;
  if (e && e.cancelable) e.preventDefault();
  pressing = false;

  jArea.classList.remove('holding');
  jHintEl.classList.remove('pressing');

  const duration = Date.now() - pressStart;
  if (duration < MIN_PRESS_MS) {
    jHintEl.textContent = '再虔诚一点 · 请长按片刻后松手';
    setTimeout(() => {
      if (!thrown) jHintEl.textContent = '长按珓杯祈愿 · 松手揭晓结果';
    }, 1700);
    return;
  }
  doThrow();
}

function doThrow() {
  thrown = true;
  // 圣杯 50%, 笑杯 25%, 阴杯 25%
  const roll = Math.random();
  const result = roll < 0.5 ? JIAOBEI[0] : roll < 0.75 ? JIAOBEI[1] : JIAOBEI[2];

  // Set final rotation to visually match the result:
  // Jiaobei has 2 sides: flat (阳/light, 0° upright) and curved (阴/dark, 180° flipped)
  // 圣杯: one flat (0°) + one curved (180°) → one正one反
  // 笑杯: both flat (0° + 0°) → 两面皆平
  // 阴杯: both curved (180° + 180°) → 两面皆凸
  // We add full spins (-720° or +720°) so the animation looks like real spinning before settling
  let endA, endB;
  if (result.name === '圣杯') {
    endA = -720 + 0;       // lands flat (阳面朝上)
    endB = 720 + 180;      // lands curved (阴面朝上)
  } else if (result.name === '笑杯') {
    endA = -720 + 0;       // lands flat
    endB = 720 + 0;        // lands flat
  } else { // 阴杯
    endA = -720 + 180;     // lands curved
    endB = 720 + 180;      // lands curved
  }

  jArea.style.setProperty('--end-a', endA + 'deg');
  jArea.style.setProperty('--end-b', endB + 'deg');
  jArea.classList.add('throwing');

  // Hide the explanation during throw
  const explainEl = document.getElementById('jbExplain');
  explainEl.style.opacity = '0';
  explainEl.style.transition = 'opacity 0.4s';

  setTimeout(() => {
    // Animation done — switch to settled state for stable display
    jArea.classList.remove('throwing');
    jArea.classList.add('settled');

    const nameEl = document.getElementById('jbName');
    const subEl  = document.getElementById('jbSub');
    nameEl.textContent = result.name;
    subEl.textContent  = result.sub;
    nameEl.classList.add('show');
    subEl.classList.add('show');
    jHintEl.style.opacity = '0';

    setTimeout(() => {
      const baseScore  = getZodiacScores()[selZodiac] ?? 75;
      const finalScore = parseFloat((baseScore * result.coeff).toFixed(2));
      const tier       = getTier(finalScore);

      localStorage.setItem(`result_${today()}`, JSON.stringify({
        zodiac: selZodiac, mbti: selMBTI,
        jiaobei: result.name, score: finalScore, tier
      }));

      renderResult(tier, finalScore, result.name);
    }, 1500);
  }, 1600);
}

// Mouse
jArea.addEventListener('mousedown', startPress);
document.addEventListener('mouseup', endPress);
// Touch
jArea.addEventListener('touchstart', startPress, { passive: false });
document.addEventListener('touchend', endPress);
document.addEventListener('touchcancel', endPress);

function shareResult() {
  if (!lastResultData) return;
  const d = lastResultData;
  const text = [
    `🔮 今日运势：${d.info.name} ${d.info.en.split('  ')[0]}`,
    `🪐 ${d.zodiac} · ${d.mbti} · ${d.jiaobei}`,
    `✅ 宜：${d.data.yi.join(' / ')}`,
    `❌ 忌：${d.data.ji.join(' / ')}`,
    `💬「${d.data.quote}」`,
    '',
    `🧠 ${d.mbti}专属：${d.data.mbtiHint}`
  ].join('\n');

  if (navigator.share) {
    navigator.share({ title: '今日运势', text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('shareBtn');
      btn.classList.add('copied');
      btn.innerHTML = '✓ 已复制到剪贴板';
      setTimeout(() => {

/* ============================================================
   STARS BACKGROUND
============================================================ */
(function () {
  const cv = document.getElementById('starsCanvas');
  const cx = cv.getContext('2d');
  let stars = [], W, H;
  const colorPool = [
    '255,255,255',
    '220,200,255',
    '255,220,240',
    '200,230,255',
    '255,240,200'
  ];

  function resize() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
  }

  function seed() {
    stars = Array.from({length: 180}, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.3 + 0.3,
      a: Math.random() * 0.7 + 0.2,
      s: Math.random() * 0.45 + 0.2,
      p: Math.random() * Math.PI * 2,
      c: colorPool[Math.floor(Math.random() * colorPool.length)]
    }));
  }

  let t = 0;
  function draw() {
    cx.clearRect(0, 0, W, H);
    t += 0.012;
    stars.forEach(s => {
      const op = s.a * (0.55 + 0.45 * Math.sin(t * s.s + s.p));
      cx.beginPath();
      cx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      cx.fillStyle = `rgba(${s.c},${op})`;
      cx.fill();
    });
    requestAnimationFrame(draw);
  }

  resize(); seed(); draw();
  window.addEventListener('resize', () => { resize(); seed(); });
})();
